name: VPS 宕机监控

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 探测状态页与关键端口
        id: probe
        run: |
          RESULTS_FILE=results.txt
          : > "$RESULTS_FILE"
          FAILED=0

          check_url() {
            name="$1"
            url="$2"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$url" 2>/dev/null)
            [ -z "$code" ] && code=000
            if [ "$code" = "200" ]; then
              echo "OK $name HTTP $code" >> "$RESULTS_FILE"
            else
              echo "FAIL $name HTTP $code" >> "$RESULTS_FILE"
              FAILED=$((FAILED+1))
            fi
          }

          check_port() {
            name="$1"
            host="$2"
            port="$3"
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$host/$port" 2>/dev/null; then
              echo "OK $name port $port open" >> "$RESULTS_FILE"
            else
              echo "FAIL $name port $port closed" >> "$RESULTS_FILE"
              FAILED=$((FAILED+1))
            fi
          }

          check_url STATUS_PAGE "https://wqqwqq.de5.net/status.json"
          check_url AI_GATEWAY "https://ai.wqqwqq.de5.net/api/status"
          check_port SSH 137.131.6.137 22
          check_port PORTAINER 137.131.6.137 9443

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          cat "$RESULTS_FILE"

      - name: 异常时微信告警（PushPlus）
        if: steps.probe.outputs.failed != '0'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          desc = open('results.txt', encoding='utf-8').read().strip()
          token = os.environ['PUSHPLUS_TOKEN']
          body = json.dumps({
              'token': token,
              'title': 'WARN VPS abnormal',
              'content': '<pre>' + desc.replace('<', '&lt;') + '</pre>',
              'template': 'html',
          }).encode()
          req = urllib.request.Request(
              'https://www.pushplus.plus/send', data=body,
              headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print('pushplus:', r.read().decode()[:200])
          except Exception as e:
              print('pushplus ERR:', e)
          PY

      - name: 正常无需告警
        if: steps.probe.outputs.failed == '0'
        run: echo all checks passed
