name: repair-ssh-expire
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Clear ubuntu account expiry via Portainer Docker API
        env:
          PW: ${{ vars.PORTAINER_PW }}
        run: |
          set -euxo pipefail
          B=https://137.131.6.137:9443
          T=$(curl -sk -X POST "$B/api/auth" -H 'Content-Type: application/json' -d "{\"Username\":\"admin\",\"Password\":\"$PW\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["jwt"])')
          AUTH="Authorization: Bearer $T"
          R=$(curl -sk -X POST "$B/api/endpoints/1/docker/containers/create?name=fix-ssh-expire" -H "$AUTH" -H 'Content-Type: application/json' -d '{"Image":"python:3.12-alpine","Cmd":["chroot","/host","/usr/bin/chage","-E","-1","ubuntu"],"HostConfig":{"Binds":["/:/host"]}}')
          echo "CREATE=$R"
          ID=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin)["Id"])')
          curl -sk -X POST "$B/api/endpoints/1/docker/containers/$ID/start" -H "$AUTH"
          curl -sk -X POST "$B/api/endpoints/1/docker/containers/$ID/wait" -H "$AUTH"
          curl -sk "$B/api/endpoints/1/docker/containers/$ID/logs?stdout=1&stderr=1" -H "$AUTH"
          curl -sk -X DELETE "$B/api/endpoints/1/docker/containers/$ID?force=1" -H "$AUTH"
          echo "DONE"